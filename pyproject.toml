[project]
name = "potok"
version = "0.4.0"
description = "Рабочий контейнер медиа-автоматизации Поток"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2",
    "feedparser>=6.0.11",
    "aiogram>=3.20,<4",
    "Flask>=3.0,<4",
    "cryptography>=43",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
